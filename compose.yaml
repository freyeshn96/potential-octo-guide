name: ${COMPOSE_PROJECT_NAME:-auth-gateway-foundation}

services:
  keycloak-db:
    image: postgres:17-alpine
    profiles: [identity]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: [identity]
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infrastructure/docker/.keycloak-realm.json:/opt/keycloak/data/import/gateway-development-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/Initialize-Development.ps1}
      SERVER_DATABASE: ${SERVER_DATABASE:-auth_gateway_server}
      SERVER_DATABASE_USER: ${SERVER_DATABASE_USER:-auth_gateway_server}
      SERVER_DATABASE_PASSWORD: ${SERVER_DATABASE_PASSWORD:?Set SERVER_DATABASE_PASSWORD}
      ADMIN_DATABASE: ${ADMIN_DATABASE:-auth_gateway_admin}
      ADMIN_DATABASE_USER: ${ADMIN_DATABASE_USER:-auth_gateway_admin}
      ADMIN_DATABASE_PASSWORD: ${ADMIN_DATABASE_PASSWORD:?Set ADMIN_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/initialize-databases.sh:/docker-entrypoint-initdb.d/initialize-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Server.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__PublicIssuerUrl: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/gateway-development
      Keycloak__DiscoveryUrl: http://keycloak:8080/realms/gateway-development/.well-known/openid-configuration
      Keycloak__AdministrativeApiUrl: http://keycloak:8080/admin
      Keycloak__AuthenticationRealm: gateway-development
      Keycloak__ClientId: gateway-reader
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:-}
      Keycloak__AllowInsecureHttp: "true"
      Database__ConnectionString: "Host=postgres;Database=${SERVER_DATABASE:-auth_gateway_server};Username=${SERVER_DATABASE_USER:-auth_gateway_server};Password=${SERVER_DATABASE_PASSWORD:?Set SERVER_DATABASE_PASSWORD};Timeout=5;Command Timeout=5"
    ports:
      - "127.0.0.1:${SERVER_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "6", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 7s
      retries: 10
      start_period: 15s

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Admin.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ConnectionString: "Host=postgres;Database=${ADMIN_DATABASE:-auth_gateway_admin};Username=${ADMIN_DATABASE_USER:-auth_gateway_admin};Password=${ADMIN_DATABASE_PASSWORD:?Set ADMIN_DATABASE_PASSWORD};Timeout=5;Command Timeout=5"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "6", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 7s
      retries: 10
      start_period: 15s

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Frontend.Dockerfile
      args:
        FRONTEND: auth-gateway-admin
        VITE_API_BASE_URL: /
    environment:
      API_UPSTREAM: admin:8080
    ports:
      - "127.0.0.1:${ADMIN_FRONTEND_PORT:-8081}:80"
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  client-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Frontend.Dockerfile
      args:
        FRONTEND: auth-gateway-client
        VITE_API_BASE_URL: /
    environment:
      API_UPSTREAM: server:8080
    ports:
      - "127.0.0.1:${CLIENT_FRONTEND_PORT:-8082}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  keycloak-postgres-data:
  postgres-data:
